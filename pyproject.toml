[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offline-agent"
version = "0.1.0"
description = "Locally-hosted, offline agentic coding agent for Jupyter AI 3 (ACP)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ryan Kitchen" }]

# Core runtime deps for the AGENT subprocess. Intentionally lightweight:
# llama-cpp-python is NOT declared here -- the offline installer builds it from
# the vendored sdist with platform-targeted CMAKE_ARGS (see scripts/install.py),
# so this package stays installable on remote-only (no-GPU) nodes.
dependencies = [
    "agent-client-protocol>=0.10,<0.11",
    "mcp>=1.0",
    "openai>=1.30",
    "pydantic>=2",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Installed inside the JupyterLab environment so the persona can register.
# The ACP bridge Jupyter AI uses to reach the agent; floored at the verified
# version. Kept out of core so remote-only (no-GPU) nodes stay lightweight.
jupyter = ["jupyter-ai-acp-client>=0.1.5"]
# Full JupyterLab host environment (mirrors supplemental_requirements.txt):
# the JupyterLab + Jupyter AI stack plus the ACP bridge from [jupyter] above.
lab = [
    "offline-agent[jupyter]",
    "jupyterlab>=4.5.8",
    "jupyter-ai>=3.0.0",
]
# Convenience marker; the installer manages the real build from deps/sdist.
local = ["llama-cpp-python"]
dev = ["pytest", "pytest-asyncio", "jsonschema"]

[project.scripts]
offline-agent = "offline_agent.agent.main:cli"
offline-agent-install = "offline_agent.install.cli:main"

[project.entry-points."jupyter_ai.personas"]
offline_agent = "offline_agent.persona:OfflineAgentPersona"

[tool.uv]
# jupyter-ai-acp-client (all releases, through 0.1.5) hard-caps
# agent-client-protocol at <0.10.0, but the agent is written and verified
# against ACP 0.10.x. The combo (acp-client 0.1.5 + ACP 0.10.1) is runtime-
# compatible -- only the upstream metadata forbids it -- so force 0.10.x here.
# uv-only (pip ignores [tool.uv]); does not propagate into the built wheel.
# Revisit if jupyter-ai-acp-client publishes a release that allows ACP >=0.10.
override-dependencies = ["agent-client-protocol>=0.10,<0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/offline_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
